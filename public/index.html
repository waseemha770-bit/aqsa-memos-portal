<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>بوابة الإستعلام عن المذكرات | وزارة الدفاع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a365d; 
            --gold-accent: #c5a059; 
            --bg-color: #f0f4f8;
            --text-main: #2d3748;
        }
        
        body {
            font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; 
            color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh;
        }

        header {
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); color: white;
            text-align: center; padding: 30px 15px; border-bottom: 5px solid var(--gold-accent);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        header h2 { margin: 0 0 5px 0; font-size: 1.3rem; font-weight: 600; color: #e2e8f0; letter-spacing: 1px; }
        header h1 { margin: 0; font-size: 2.2rem; font-weight: 700; color: var(--gold-accent); text-shadow: 1px 1px 4px rgba(0,0,0,0.5); }

        .main-content { flex: 1; padding: 20px; display: flex; justify-content: center; align-items: flex-start; margin-top: 40px; }
        .container { width: 100%; max-width: 700px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border-top: 4px solid var(--primary-color); }

        .search-box { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        input[type="text"] { width: 100%; padding: 16px; font-size: 1.1rem; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; transition: all 0.3s ease; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        input[type="text"]:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1); }
        
        button { padding: 16px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: background-color 0.3s; font-family: 'Cairo', sans-serif; }
        button:hover { background-color: #122642; }

        .loader { display: none; text-align: center; margin: 20px 0; font-size: 1.1rem; font-weight: bold; color: var(--primary-color); }

        .result-card { border-right: 5px solid var(--gold-accent); background: #f8fafc; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); border-left: 1px solid #e2e8f0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; transition: transform 0.2s; }
        .result-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .result-card h3 { margin-top: 0; color: var(--primary-color); font-size: 1.4rem; margin-bottom: 15px;}
        .result-card p { margin: 8px 0; font-size: 1.1rem; line-height: 1.6; }
        
        .memo-link { display: inline-block; margin-top: 15px; margin-bottom: 5px; padding: 10px 25px; background: var(--primary-color); color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .memo-link:hover { background: #122642; }

        footer { background-color: #1a202c; color: #a0aec0; text-align: center; padding: 15px 10px; font-size: 1rem; border-top: 3px solid var(--gold-accent); }
        footer span { color: var(--gold-accent); font-weight: bold; display: inline-block; }

        @media (min-width: 600px) {
            .search-box { flex-direction: row; }
            input[type="text"] { flex: 1; }
            button { width: 160px; }
        }
    </style>
</head>
<body>

    <header>
        <h2>الجمهورية اليمنية-وزارة الدفاع</h2>
        <h1>بوابة الإستعلام عن المذكرات</h1>
    </header>

    <div class="main-content">
        <div class="container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="أدخل رقم المذكرة للاستعلام..." onkeypress="handleKeyPress(event)">
                <button onclick="searchMemo()">بحث</button>
            </div>

            <div id="loader" class="loader">جاري الاستعلام، يرجى الانتظار...</div>
            <div id="results"></div>
        </div>
    </div>

    <footer>
        برمجة المهندس / <span>وسيم همدان الأهنومي(771954200)</span>
    </footer>

    <script>
        async function searchMemo() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const loader = document.getElementById('loader');

            if (!query) {
                alert("يرجى إدخال رقم المذكرة أولاً");
                return;
            }

            resultsDiv.innerHTML = "";
            loader.style.display = "block";

            try {
                const response = await fetch(`/api/search?query=${query}`);
                const data = await response.json();
                
                loader.style.display = "none";

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = "<p style='color:#e53e3e; text-align:center; font-size:1.1rem; font-weight:bold;'>لم يتم العثور على مذكرات مطابقة للرقم المدخل.</p>";
                    return;
                }

                data.results.forEach(item => {
                    // التحقق مما إذا كانت الحالة عبارة عن رابط (تبدأ بـ http) لإنشاء زر، أو عرضها كنص عادي
                    let statusHtml = '';
                    if (item.status && item.status.startsWith('http')) {
                        statusHtml = `<a href="${item.status}" target="_blank" class="memo-link">عرض حالة المذكرة / المرفقات</a>`;
                    } else {
                        statusHtml = `<p><strong>حالة المذكرة:</strong> <span style="color:#2b6cb0; font-weight:bold;">${item.status || '---'}</span></p>`;
                    }

                    resultsDiv.innerHTML += `
                        <div class="result-card">
                            <h3>رقم المذكرة: ${item.memo_number}</h3>
                            ${statusHtml}
                            <p><strong>تاريخ التحديث:</strong> ${item.date || '---'}</p>
                            <p><strong>ملاحظات:</strong> ${item.notes || '---'}</p>
                        </div>
                    `;
                });
            } catch (error) {
                loader.style.display = "none";
                resultsDiv.innerHTML = "<p style='color:#e53e3e; text-align:center; font-weight:bold;'>حدث خطأ في الاتصال بقاعدة البيانات.</p>";
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchMemo();
            }
        }
    </script>
</body>
</html>
