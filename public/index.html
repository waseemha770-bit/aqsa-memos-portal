<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الإستعلام عن المذكرات | وزارة الدفاع</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192x192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #1a365d; --gold-accent: #c5a059; --bg-color: #f0f4f8; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 15px; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px; }
        button { padding: 15px 30px; background-color: #1a365d; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #installBtn { display: none; margin-top: 20px; background-color: #c5a059; }
    </style>
</head>
<body>
    <div class="container">
        <h1>بوابة الاستعلام</h1>
        <input type="text" id="searchInput" placeholder="رقم المذكرة...">
        <button onclick="searchMemo()">بحث</button>
        <button id="installBtn">تثبيت التطبيق 📱</button>
        <div id="results"></div>
    </div>

    <script>
        // تسجيل الـ Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
